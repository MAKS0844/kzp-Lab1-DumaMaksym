name: Build
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Verify on Unix
      if: runner.os != 'Windows'
      run: ./mvnw -B verify
    - name: Verify on Windows
      if: runner.os == 'Windows'
      run: .\mvnw.cmd -B verify
    - name: Package on Unix
      if: runner.os != 'Windows'
      run: ./mvnw -B package
    - name: Package on Windows
      if: runner.os == 'Windows'
      run: .\mvnw.cmd -B package
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: storage-export-${{ matrix.os }}
        path: target/*.jar
